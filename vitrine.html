<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2A1F0E">
<title>Notre Cave à Rhums</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C8922A;--amber:#E8A020;--dark:#2A1F0E;--cream:#FAF5EB;
  --white:#FFFFFF;--border:rgba(107,63,26,0.13);--muted:rgba(42,31,14,0.42);
  --serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:var(--cream);font-family:var(--sans);}

/* HEADER */
.hero{background:var(--dark);padding:36px 20px 28px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 30px,rgba(200,146,42,0.05) 30px,rgba(200,146,42,0.05) 31px);}
.hero-inner{position:relative;z-index:1;}
.hero-icon{font-size:48px;margin-bottom:12px;display:block;}
.hero-title{font-family:var(--serif);color:#F5DFA0;font-size:28px;font-weight:500;letter-spacing:-0.5px;margin-bottom:6px;}
.hero-sub{color:rgba(245,223,160,0.5);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;font-weight:300;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(200,146,42,0.15);border:0.5px solid rgba(200,146,42,0.3);border-radius:20px;padding:5px 14px;font-size:12px;color:rgba(245,223,160,0.7);margin-top:14px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* CONTENT */
.content{padding:20px 16px;max-width:600px;margin:0 auto;}

/* FILTRE */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.filter-btn{background:var(--white);border:0.5px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-family:var(--sans);cursor:pointer;color:var(--muted);}
.filter-btn.active{background:var(--gold);border-color:var(--gold);color:var(--dark);font-weight:500;}

/* RHUM CARDS */
.rhum-list{display:flex;flex-direction:column;gap:12px;}
.rhum-card{background:var(--white);border-radius:14px;border:0.5px solid var(--border);padding:16px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 1px 4px rgba(42,31,14,0.05);}
.rhum-card.out-of-stock{opacity:0.55;}
.rh-emoji{font-size:32px;flex-shrink:0;}
.rh-body{flex:1;min-width:0;}
.rh-name{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--dark);margin-bottom:3px;}
.rh-meta{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.rh-bottom{display:flex;justify-content:space-between;align-items:flex-end;}
.rh-price{font-family:var(--serif);font-size:22px;color:var(--gold);font-weight:500;}
.rh-price-sub{font-size:11px;color:var(--muted);}
.stock-badge{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.stock-num{font-family:var(--serif);font-size:20px;font-weight:500;}
.stock-num.ok{color:#1A6B3F;}
.stock-num.low{color:#C8922A;}
.stock-num.out{color:#8B1A1A;}
.stock-label{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);}
.deg-bar{height:3px;background:rgba(200,146,42,0.12);border-radius:2px;margin:8px 0 0;overflow:hidden;}
.deg-fill{height:100%;background:var(--gold);border-radius:2px;}

.pill{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;}
.p-amber{background:rgba(200,146,42,0.12);color:#633806;}
.p-teal{background:#E1F5EE;color:#085041;}
.p-coral{background:#FAECE7;color:#712B13;}
.p-gray{background:#F1EFE8;color:#444441;}
.p-pink{background:#FBEAF0;color:#72243E;}

/* DISPO TAG */
.dispo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 10px;border-radius:10px;}
.dispo.ok{background:rgba(26,107,63,0.1);color:#1A6B3F;}
.dispo.low{background:rgba(200,146,42,0.12);color:#854F0B;}
.dispo.out{background:rgba(139,26,26,0.1);color:#8B1A1A;}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1rem;gap:12px;color:var(--muted);}
.spinner{width:32px;height:32px;border:2px solid rgba(200,146,42,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:13px;}

/* FOOTER */
.footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:11px;border-top:0.5px solid var(--border);margin-top:24px;}
.footer strong{color:var(--dark);}

/* CONTACT BANNER */
.contact-banner{background:var(--dark);border-radius:12px;padding:16px;text-align:center;margin-top:20px;margin-bottom:4px;}
.contact-banner p{color:rgba(245,223,160,0.6);font-size:13px;margin-bottom:8px;}
.contact-banner strong{color:#F5DFA0;font-family:var(--serif);font-size:15px;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <span class="hero-icon" id="v-icon">🍹</span>
    <div class="hero-title" id="v-title">Notre Cave à Rhums</div>
    <div class="hero-sub" id="v-sub">Rhums artisanaux — Production locale</div>
    <div class="hero-badge"><div class="sync-dot"></div> Stock mis à jour en temps réel</div>
  </div>
</div>

<div class="content">
  <div id="loading" class="loading"><div class="spinner"></div><span>Chargement du catalogue…</span></div>
  <div id="catalogue-content" style="display:none">
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" onclick="filterType('tous',this)">Tous</button>
    </div>
    <div class="rhum-list" id="rhum-list"></div>
    <div class="contact-banner" id="contact-banner">
      <p>Intéressé par nos rhums ?</p>
      <strong id="v-contact">Contactez-nous pour passer commande</strong>
    </div>
  </div>
</div>

<div class="footer">
  Vitrine publique — <strong id="footer-name">Rhums Artisanaux</strong><br>
  <span id="last-update"></span>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyCSg5EehBOw6e23X_ZIWfpvFCXUWpwYw5c",
  authDomain:"rhums-artisanaux.firebaseapp.com",
  databaseURL:"https://rhums-artisanaux-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"rhums-artisanaux",
  storageBucket:"rhums-artisanaux.firebasestorage.app",
  messagingSenderId:"820033797821",
  appId:"1:820033797821:web:4d0991294f911dc5b6c1d4"
});

const db = firebase.database();
let rhums = {};
let activeFilter = 'tous';

const EM  = {"Blanc":"🫙","Vieux":"🪵","Ambré":"🥃","Arrangé":"🍋","Épicé":"🌶️"};
const PL  = {"Blanc":"p-gray","Vieux":"p-amber","Ambré":"p-coral","Arrangé":"p-teal","Épicé":"p-pink"};

// Charger la config (nom, emoji, couleurs) depuis Firebase
db.ref('config').on('value', snap => {
  const cfg = snap.val() || {};
  if(cfg.appname){
    document.getElementById('v-title').textContent = cfg.appname;
    document.getElementById('footer-name').textContent = cfg.appname;
    document.title = cfg.appname + ' — Vitrine';
  }
  if(cfg.appsub) document.getElementById('v-sub').textContent = cfg.appsub;
  if(cfg.emoji)  document.getElementById('v-icon').textContent = cfg.emoji;
  if(cfg.contact) document.getElementById('v-contact').textContent = cfg.contact;
  // Appliquer les couleurs
  const root = document.documentElement;
  if(cfg.gold){root.style.setProperty('--gold',cfg.gold);root.style.setProperty('--amber',cfg.gold);}
  if(cfg.dark) root.style.setProperty('--dark',cfg.dark);
  if(cfg.cream) root.style.setProperty('--cream',cfg.cream);
});

// Charger les rhums en temps réel
db.ref('rhums').on('value', snap => {
  rhums = snap.val() || {};
  document.getElementById('loading').style.display = 'none';
  document.getElementById('catalogue-content').style.display = 'block';
  document.getElementById('last-update').textContent =
    'Dernière mise à jour : ' + new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  buildFilters();
  renderRhums();
});

function rhumsArr(){
  return Object.values(rhums).sort((a,b)=>a.nom.localeCompare(b.nom));
}

function buildFilters(){
  const types = [...new Set(rhumsArr().map(r=>r.type))];
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = `<button class="filter-btn ${activeFilter==='tous'?'active':''}" onclick="filterType('tous',this)">Tous</button>`;
  types.forEach(t => {
    const active = activeFilter===t?'active':'';
    bar.innerHTML += `<button class="filter-btn ${active}" onclick="filterType('${t}',this)">${EM[t]||''} ${t}</button>`;
  });
}

function filterType(type, btn){
  activeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderRhums();
}

function renderRhums(){
  let list = rhumsArr();
  if(activeFilter !== 'tous') list = list.filter(r=>r.type===activeFilter);

  if(list.length === 0){
    document.getElementById('rhum-list').innerHTML = '<div class="empty">Aucun rhum disponible pour le moment.</div>';
    return;
  }

  document.getElementById('rhum-list').innerHTML = list.map(r => {
    const stock = r.stock || 0;
    const stockClass = stock === 0 ? 'out' : stock <= 5 ? 'low' : 'ok';
    const dispoText = stock === 0 ? 'Épuisé' : stock <= 5 ? 'Stock limité' : 'Disponible';
    const dispoClass = stockClass;

    return `
    <div class="rhum-card ${stock===0?'out-of-stock':''}">
      <div class="rh-emoji">${EM[r.type]||'🍹'}</div>
      <div class="rh-body">
        <div class="rh-name">${r.nom}</div>
        <div class="rh-meta">
          <span class="pill ${PL[r.type]||'p-gray'}">${r.type}</span>
          ${r.degre ? `<span>${r.degre}° alc.</span>` : ''}
          ${r.millesime ? `<span>· ${r.millesime}</span>` : ''}
          <span class="dispo ${dispoClass}">${dispoText}</span>
        </div>
        <div class="deg-bar"><div class="deg-fill" style="width:${Math.min(r.degre||40,90)/90*100}%"></div></div>
        <div class="rh-bottom" style="margin-top:10px">
          <div>
            <div class="rh-price">${Number(r.prix).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}</div>
            <div class="rh-price-sub">par bouteille</div>
          </div>
          <div class="stock-badge">
            <div class="stock-num ${stockClass}">${stock}</div>
            <div class="stock-label">en stock</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
