<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2A1F0E">
<title>Rhums Artisanaux</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root {
  --gold: #C8922A;
  --gold-light: #F5DFA0;
  --amber: #E8A020;
  --dark: #2A1F0E;
  --brown: #6B3F1A;
  --cream: #FAF5EB;
  --white: #FFFFFF;
  --success: #1A6B3F;
  --danger: #8B1A1A;
  --border: rgba(107,63,26,0.13);
  --muted: rgba(42,31,14,0.42);
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --nav-h: 64px;
  --header-h: 120px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--dark); }
body { font-family: var(--sans); display: flex; flex-direction: column; }

/* ─── HEADER ─────────────────────────────────── */
.header {
  background: var(--dark);
  padding: env(safe-area-inset-top, 12px) 16px 0;
  padding-top: max(env(safe-area-inset-top), 12px);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(45deg, transparent, transparent 30px, rgba(200,146,42,0.05) 30px, rgba(200,146,42,0.05) 31px);
}
.header-inner { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-icon { width: 38px; height: 38px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.brand-name { font-family: var(--serif); color: var(--gold-light); font-size: 19px; font-weight: 500; line-height: 1.1; }
.brand-sub { color: rgba(245,223,160,0.45); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 300; }
.save-btn { background: var(--gold); color: var(--dark); border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: var(--sans); white-space: nowrap; }
.save-btn:active { background: var(--amber); transform: scale(0.97); }

/* ─── SCROLL CONTENT ─────────────────────────── */
.main { flex: 1; overflow-y: auto; background: var(--cream); -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 12px) + 12px); }

/* ─── BOTTOM NAV ─────────────────────────────── */
.bottom-nav {
  background: var(--dark);
  border-top: 0.5px solid rgba(200,146,42,0.2);
  display: flex;
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
}
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 8px 4px; color: rgba(245,223,160,0.4); font-family: var(--sans); font-size: 10px; letter-spacing: 0.3px; transition: color 0.15s; }
.nav-btn.active { color: var(--gold-light); }
.nav-btn .ti { font-size: 22px; }
.nav-btn span { font-size: 10px; }

/* ─── SECTIONS ───────────────────────────────── */
.section { display: none; padding: 16px; }
.section.active { display: block; }

/* ─── UNSAVED BANNER ─────────────────────────── */
.unsaved { background: rgba(200,146,42,0.12); border: 0.5px solid rgba(200,146,42,0.35); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--brown); margin-bottom: 14px; display: none; align-items: center; gap: 8px; }
.unsaved strong { color: #4A2C08; }

/* ─── SAVE INFO ──────────────────────────────── */
.save-info-bar { background: rgba(200,146,42,0.08); border-bottom: 0.5px solid rgba(200,146,42,0.15); padding: 6px 16px; display: flex; justify-content: space-between; align-items: center; }
.save-ts { font-size: 11px; color: var(--muted); }
.io-btns { display: flex; gap: 6px; }
.io-btn { background: none; border: 0.5px solid rgba(107,63,26,0.25); color: var(--brown); padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 3px; font-family: var(--sans); }
.io-btn:active { background: rgba(107,63,26,0.08); }

/* ─── KPI GRID ───────────────────────────────── */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--white); border-radius: 12px; padding: 14px; border: 0.5px solid var(--border); }
.kpi .kl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
.kpi .kv { font-family: var(--serif); font-size: 20px; font-weight: 500; color: var(--dark); line-height: 1.1; }
.kpi .ks { font-size: 11px; color: var(--muted); margin-top: 2px; }
.kpi.green .kv { color: var(--success); }
.kpi.red .kv { color: var(--danger); }

/* ─── PANELS ─────────────────────────────────── */
.panel { background: var(--white); border-radius: 12px; border: 0.5px solid var(--border); padding: 14px; margin-bottom: 12px; }
.panel-title { font-family: var(--serif); font-size: 15px; font-weight: 500; color: var(--dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.panel-title::before { content: ''; display: block; width: 3px; height: 15px; background: var(--gold); border-radius: 2px; flex-shrink: 0; }

/* ─── RHUM CARDS ─────────────────────────────── */
.rhum-list { display: flex; flex-direction: column; gap: 10px; }
.rhum-card { background: var(--white); border-radius: 12px; border: 0.5px solid var(--border); padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
.rh-left { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 48px; }
.rh-emoji { font-size: 28px; }
.rh-right { flex: 1; min-width: 0; }
.rh-name { font-family: var(--serif); font-size: 15px; font-weight: 500; color: var(--dark); margin-bottom: 2px; }
.rh-meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.rh-row { display: flex; justify-content: space-between; align-items: center; }
.rh-price { font-family: var(--serif); font-size: 18px; color: var(--gold); font-weight: 500; }
.rh-stock { font-size: 12px; color: var(--muted); }
.deg-bar { height: 3px; background: rgba(200,146,42,0.15); border-radius: 2px; margin: 8px 0; overflow: hidden; }
.deg-fill { height: 100%; background: var(--gold); border-radius: 2px; }
.rh-actions { display: flex; gap: 6px; margin-top: 8px; }

/* ─── PILLS ──────────────────────────────────── */
.pill { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.p-amber { background: rgba(200,146,42,0.12); color: #633806; }
.p-teal { background: #E1F5EE; color: #085041; }
.p-coral { background: #FAECE7; color: #712B13; }
.p-gray { background: #F1EFE8; color: #444441; }
.p-pink { background: #FBEAF0; color: #72243E; }
.p-blue { background: #E6F1FB; color: #0C447C; }
.p-green { background: #EAF3DE; color: #27500A; }

/* ─── ROWS TABLE ─────────────────────────────── */
.tbl-head { display: grid; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid rgba(107,63,26,0.18); font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 500; }
.tbl-row { display: grid; gap: 8px; padding: 10px 0; border-bottom: 0.5px solid rgba(107,63,26,0.07); font-size: 13px; color: var(--dark); align-items: center; }
.cols-v { grid-template-columns: 1fr 60px 70px 28px; }
.cols-d { grid-template-columns: 1fr 60px 70px 28px; }

/* ─── VENTE CARD (mobile style) ──────────────── */
.vente-card { background: var(--white); border-radius: 10px; border: 0.5px solid var(--border); padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.vc-left { flex: 1; min-width: 0; }
.vc-name { font-weight: 500; font-size: 14px; color: var(--dark); }
.vc-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.vc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.vc-price { font-family: var(--serif); font-size: 16px; color: var(--gold); font-weight: 500; }

/* ─── FORMS ──────────────────────────────────── */
.form-card { background: var(--white); border-radius: 12px; border: 0.5px solid rgba(200,146,42,0.3); padding: 16px; margin-bottom: 14px; display: none; }
.form-card h4 { font-family: var(--serif); font-size: 16px; color: var(--dark); margin-bottom: 14px; }
.fg { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.fg label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; font-weight: 500; }
.fg input, .fg select { font-family: var(--sans); font-size: 15px; border: 0.5px solid rgba(107,63,26,0.22); border-radius: 8px; padding: 10px 12px; background: #FDFAF4; color: var(--dark); width: 100%; -webkit-appearance: none; }
.fg input:focus, .fg select:focus { outline: none; border-color: var(--gold); }
.fr2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ─── BUTTONS ────────────────────────────────── */
.btn-gold { background: var(--gold); color: var(--dark); border: none; padding: 11px 18px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--sans); }
.btn-gold:active { background: var(--amber); transform: scale(0.98); }
.btn-ghost { background: none; border: 0.5px solid rgba(107,63,26,0.2); color: var(--muted); padding: 11px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: var(--sans); }
.btn-del { background: none; border: none; color: var(--danger); padding: 6px; cursor: pointer; display: flex; align-items: center; }
.btn-del:active { opacity: 0.6; }
.btn-stk { background: none; border: 0.5px solid rgba(200,146,42,0.3); color: var(--brown); padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: var(--sans); display: flex; align-items: center; gap: 3px; }
.btn-danger { background: none; border: 0.5px solid rgba(139,26,26,0.3); color: var(--danger); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: var(--sans); }
.btn-full { width: 100%; padding: 13px; font-size: 15px; }
.btn-row { display: flex; gap: 8px; margin-top: 4px; }

/* ─── TOTAL PREVIEW ──────────────────────────── */
.total-preview { background: rgba(200,146,42,0.08); border: 0.5px solid rgba(200,146,42,0.25); border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
.total-preview .tl { font-size: 13px; color: var(--muted); }
.total-preview .tv { font-family: var(--serif); font-size: 24px; color: var(--gold); font-weight: 500; }

/* ─── CHART ──────────────────────────────────── */
.chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
.cb-col { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; min-width: 0; }
.cb-bar { width: 100%; background: var(--gold); border-radius: 3px 3px 0 0; min-height: 4px; }
.cb-lbl { font-size: 9px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.cb-val { font-size: 10px; color: var(--muted); }

/* ─── BILAN ──────────────────────────────────── */
.bilan-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 0.5px solid rgba(107,63,26,0.07); font-size: 13px; color: var(--dark); }
.bilan-total { display: flex; justify-content: space-between; padding-top: 10px; font-family: var(--serif); font-size: 15px; color: var(--dark); font-weight: 500; }
.marge-bar { height: 6px; background: rgba(200,146,42,0.15); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.marge-fill { height: 100%; border-radius: 3px; }
.benefice-big { font-family: var(--serif); font-size: 32px; font-weight: 500; }

/* ─── MISC ───────────────────────────────────── */
.top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
.sec-title { font-family: var(--serif); font-size: 20px; color: var(--dark); font-weight: 500; }
.sec-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.empty { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 13px; }
.badge-low { background: rgba(139,26,26,0.1); color: var(--danger); padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.stock-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 0.5px solid rgba(107,63,26,0.07); font-size: 13px; color: var(--dark); }

/* ─── TOAST ──────────────────────────────────── */
.toast { display: none; position: fixed; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px); left: 50%; transform: translateX(-50%); background: var(--dark); color: var(--gold-light); border-radius: 10px; padding: 10px 18px; font-size: 13px; font-family: var(--sans); z-index: 999; border: 0.5px solid rgba(200,146,42,0.4); white-space: nowrap; }

/* ─── SECTION TITLE BAR ──────────────────────── */
.s-header { padding: 14px 16px 0; }
.s-header .sec-title { font-size: 22px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">🍹</div>
      <div>
        <div class="brand-name">Rhums Artisanaux</div>
        <div class="brand-sub">Gestion & Comptabilité</div>
      </div>
    </div>
    <button class="save-btn" onclick="saveData()">
      <i class="ti ti-device-floppy" style="font-size:16px"></i> Sauvegarder
    </button>
  </div>
</div>

<!-- SAVE INFO BAR -->
<div class="save-info-bar">
  <span class="save-ts" id="save-ts">Chargement…</span>
  <div class="io-btns">
    <button class="io-btn" onclick="exportData()"><i class="ti ti-download"></i> Exporter</button>
    <button class="io-btn" onclick="document.getElementById('imp').click()"><i class="ti ti-upload"></i> Importer</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>

<!-- MAIN SCROLL AREA -->
<div class="main" id="main">
  <div class="unsaved" id="unsaved">
    <i class="ti ti-alert-triangle" style="font-size:15px;color:#C8922A"></i>
    Non sauvegardé — cliquez sur <strong>Sauvegarder</strong>
  </div>

  <!-- DASHBOARD -->
  <div id="s-dashboard" class="section active">
    <div class="kpi-grid" id="kpi-grid"></div>
    <div class="panel"><div class="panel-title">Ventes par rhum</div><div class="chart-bars" id="chart-bars"></div></div>
    <div class="panel"><div class="panel-title">Stocks faibles</div><div id="stocks-faibles"></div></div>
    <div class="panel"><div class="panel-title">Dernières ventes</div><div id="last-ventes"></div></div>
  </div>

  <!-- CATALOGUE -->
  <div id="s-catalogue" class="section">
    <div class="top-row">
      <div><div class="sec-title">Catalogue</div><div class="sec-sub" id="cat-sub"></div></div>
      <button class="btn-gold" onclick="toggleF('f-rhum')" style="padding:9px 14px;font-size:13px"><i class="ti ti-plus"></i> Ajouter</button>
    </div>
    <div class="form-card" id="f-rhum">
      <h4>Nouveau rhum</h4>
      <div class="fr2">
        <div class="fg"><label>Nom</label><input id="nr-nom" placeholder="Blanc Traditionnel"></div>
        <div class="fg"><label>Type</label><select id="nr-type"><option>Blanc</option><option>Vieux</option><option>Ambré</option><option>Arrangé</option><option>Épicé</option></select></div>
      </div>
      <div class="fr2">
        <div class="fg"><label>Prix (€)</label><input type="number" id="nr-prix" placeholder="25" inputmode="decimal"></div>
        <div class="fg"><label>Stock initial</label><input type="number" id="nr-stock" placeholder="20" inputmode="numeric"></div>
      </div>
      <div class="fr2">
        <div class="fg"><label>Degré (%)</label><input type="number" id="nr-degre" placeholder="40" inputmode="decimal"></div>
        <div class="fg"><label>Millésime</label><input id="nr-millesime" placeholder="Cuvée 2024"></div>
      </div>
      <div class="btn-row">
        <button class="btn-gold" onclick="addRhum()">Enregistrer</button>
        <button class="btn-ghost" onclick="toggleF('f-rhum')">Annuler</button>
      </div>
    </div>
    <div class="rhum-list" id="rhum-list"></div>
  </div>

  <!-- VENTES -->
  <div id="s-ventes" class="section">
    <div class="top-row">
      <div><div class="sec-title">Ventes</div><div class="sec-sub" id="ventes-sub"></div></div>
      <button class="btn-danger" id="btn-clear-v" style="display:none;padding:8px 12px;font-size:12px" onclick="clearVentes()"><i class="ti ti-trash"></i></button>
    </div>
    <div id="ventes-list"></div>
  </div>

  <!-- DEPENSES -->
  <div id="s-depenses" class="section">
    <div class="top-row">
      <div><div class="sec-title">Dépenses</div><div class="sec-sub" id="dep-sub"></div></div>
      <button class="btn-gold" onclick="toggleF('f-dep')" style="padding:9px 14px;font-size:13px"><i class="ti ti-plus"></i> Ajouter</button>
    </div>
    <div class="form-card" id="f-dep">
      <h4>Nouvelle dépense</h4>
      <div class="fg"><label>Description</label><input id="nd-desc" placeholder="Achat canne à sucre…"></div>
      <div class="fg"><label>Catégorie</label><select id="nd-cat"><option>Matières premières</option><option>Bouteilles / Bouchons</option><option>Étiquettes / Emballages</option><option>Équipement / Matériel</option><option>Transport / Livraison</option><option>Marché / Foire</option><option>Énergie / Eau</option><option>Autre</option></select></div>
      <div class="fr2">
        <div class="fg"><label>Montant (€)</label><input type="number" id="nd-montant" placeholder="0.00" inputmode="decimal"></div>
        <div class="fg"><label>Date</label><input type="date" id="nd-date"></div>
      </div>
      <div class="btn-row">
        <button class="btn-gold" onclick="addDep()">Enregistrer</button>
        <button class="btn-ghost" onclick="toggleF('f-dep')">Annuler</button>
      </div>
    </div>
    <div id="dep-list"></div>
  </div>

  <!-- BENEFICE -->
  <div id="s-benefice" class="section">
    <div class="sec-title" style="margin-bottom:14px">Bilan financier</div>
    <div id="bilan"></div>
  </div>

  <!-- NOUVELLE VENTE -->
  <div id="s-ajouter" class="section">
    <div class="sec-title" style="margin-bottom:14px">Nouvelle vente</div>
    <div class="panel">
      <div class="fg"><label>Rhum</label><select id="v-rhum" onchange="autoPrix()"></select></div>
      <div class="fr2">
        <div class="fg"><label>Quantité</label><input type="number" id="v-qte" value="1" min="1" inputmode="numeric" oninput="calcTotal()"></div>
        <div class="fg"><label>Prix (€)</label><input type="number" id="v-prix" step="0.5" inputmode="decimal" oninput="calcTotal()"></div>
      </div>
      <div class="fg"><label>Client (optionnel)</label><input id="v-client" placeholder="Nom ou marché…"></div>
      <div class="fr2">
        <div class="fg"><label>Date</label><input type="date" id="v-date"></div>
        <div class="fg"><label>Canal</label><select id="v-lieu"><option>Marché local</option><option>Vente directe</option><option>En ligne</option><option>Boutique</option><option>Événement</option><option>Autre</option></select></div>
      </div>
      <div class="total-preview"><span class="tl">Total</span><span class="tv" id="v-total">0,00 €</span></div>
      <button class="btn-gold btn-full" onclick="addVente()">Enregistrer la vente</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="go('dashboard',this)">
    <i class="ti ti-layout-dashboard"></i><span>Accueil</span>
  </button>
  <button class="nav-btn" onclick="go('catalogue',this)">
    <i class="ti ti-bottle"></i><span>Catalogue</span>
  </button>
  <button class="nav-btn" onclick="go('ajouter',this)" style="position:relative">
    <div style="width:44px;height:44px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;position:absolute;top:-16px;border:3px solid var(--dark)">
      <i class="ti ti-plus" style="font-size:22px;color:var(--dark)"></i>
    </div>
    <span style="margin-top:20px">Vente</span>
  </button>
  <button class="nav-btn" onclick="go('depenses',this)">
    <i class="ti ti-receipt"></i><span>Dépenses</span>
  </button>
  <button class="nav-btn" onclick="go('benefice',this)">
    <i class="ti ti-chart-bar"></i><span>Bilan</span>
  </button>
</nav>

<script>
const SK='rhums-v3';
const EM={"Blanc":"🫙","Vieux":"🪵","Ambré":"🥃","Arrangé":"🍋","Épicé":"🌶️"};
const PL={"Blanc":"p-gray","Vieux":"p-amber","Ambré":"p-coral","Arrangé":"p-teal","Épicé":"p-pink"};
const CPL={"Matières premières":"p-green","Bouteilles / Bouchons":"p-blue","Étiquettes / Emballages":"p-teal","Équipement / Matériel":"p-gray","Transport / Livraison":"p-amber","Marché / Foire":"p-coral","Énergie / Eau":"p-blue","Autre":"p-gray"};
let rhums=[],ventes=[],depenses=[],nR=1,nV=1,nD=1,dirty=false;

const DD={
  rhums:[{id:1,nom:"Blanc Traditionnel",type:"Blanc",prix:22,stock:18,degre:55,millesime:"Cuvée 2024"},{id:2,nom:"Vieux Cœur de Chauffe",type:"Vieux",prix:38,stock:6,degre:42,millesime:"Cuvée 2022"},{id:3,nom:"Arrangé Passion-Vanille",type:"Arrangé",prix:28,stock:14,degre:30,millesime:"Cuvée 2023"},{id:4,nom:"Ambré Fût de Chêne",type:"Ambré",prix:34,stock:3,degre:40,millesime:"Cuvée 2021"}],
  ventes:[{id:1,rhumId:1,qte:3,prix:22,client:"Marché de Noël",date:"2025-12-14",lieu:"Marché local"},{id:2,rhumId:3,qte:2,prix:28,client:"Marie D.",date:"2025-12-18",lieu:"Vente directe"},{id:3,rhumId:2,qte:1,prix:38,client:"Bar Le Marin",date:"2025-12-20",lieu:"Boutique"},{id:4,rhumId:4,qte:2,prix:34,client:"Fête de village",date:"2026-01-05",lieu:"Événement"},{id:5,rhumId:1,qte:5,prix:22,client:"François L.",date:"2026-01-12",lieu:"Vente directe"}],
  depenses:[{id:1,desc:"Canne à sucre (100 kg)",cat:"Matières premières",montant:85,date:"2025-11-10"},{id:2,desc:"Bouteilles 70cl x50",cat:"Bouteilles / Bouchons",montant:45,date:"2025-11-15"},{id:3,desc:"Étiquettes personnalisées",cat:"Étiquettes / Emballages",montant:60,date:"2025-11-20"},{id:4,desc:"Emplacement marché de Noël",cat:"Marché / Foire",montant:30,date:"2025-12-01"},{id:5,desc:"Propane distillation",cat:"Énergie / Eau",montant:25,date:"2025-12-05"}],
  nR:5,nV:6,nD:6
};

function mark(){dirty=true;document.getElementById('unsaved').style.display='flex';}
function saveData(){
  try{localStorage.setItem(SK,JSON.stringify({rhums,ventes,depenses,nR,nV,nD,savedAt:new Date().toISOString()}));dirty=false;document.getElementById('unsaved').style.display='none';document.getElementById('save-ts').textContent='Sauvegardé à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});toast('✓ Sauvegardé');}catch(e){toast('Erreur de sauvegarde');}
}
function loadData(){
  try{const r=localStorage.getItem(SK);if(r){const d=JSON.parse(r);rhums=d.rhums||[];ventes=d.ventes||[];depenses=d.depenses||[];nR=d.nR||1;nV=d.nV||1;nD=d.nD||1;const dt=new Date(d.savedAt);document.getElementById('save-ts').textContent='Sauvegarde : '+dt.toLocaleDateString('fr-FR')+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}else{rhums=DD.rhums;ventes=DD.ventes;depenses=DD.depenses;nR=DD.nR;nV=DD.nV;nD=DD.nD;document.getElementById('save-ts').textContent='Données exemple — sauvegardez !';mark();}}catch(e){rhums=DD.rhums;ventes=DD.ventes;depenses=DD.depenses;nR=DD.nR;nV=DD.nV;nD=DD.nD;}
  renderDash();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function eur(v){return Number(v).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});}
function fdt(d){return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function gr(id){return rhums.find(r=>r.id===id);}
function tv(v){return v.qte*v.prix;}
function ca(){return ventes.reduce((s,v)=>s+tv(v),0);}
function tdep(){return depenses.reduce((s,d)=>s+d.montant,0);}
function ben(){return ca()-tdep();}
function qv(id){return ventes.filter(v=>v.rhumId===id).reduce((s,v)=>s+v.qte,0);}

function go(t,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('s-'+t).classList.add('active');
  if(btn)btn.classList.add('active');
  document.getElementById('main').scrollTop=0;
  if(t==='dashboard')renderDash();
  if(t==='catalogue')renderCat();
  if(t==='ventes')renderVentes();
  if(t==='depenses')renderDep();
  if(t==='benefice')renderBilan();
  if(t==='ajouter')initAV();
}

function renderDash(){
  const b=ben(),pos=b>=0;
  document.getElementById('kpi-grid').innerHTML=`
    <div class="kpi"><div class="kl">Chiffre d'affaires</div><div class="kv">${eur(ca())}</div><div class="ks">${ventes.length} ventes</div></div>
    <div class="kpi"><div class="kl">Dépenses</div><div class="kv">${eur(tdep())}</div><div class="ks">${depenses.length} entrées</div></div>
    <div class="kpi ${pos?'green':'red'}" style="grid-column:1/-1"><div class="kl">Bénéfice net</div><div class="kv" style="font-size:26px">${eur(b)}</div><div class="ks">${pos?'✓ Positif':'⚠ Déficit'}</div></div>`;
  const mx=Math.max(...rhums.map(r=>qv(r.id)),1);
  document.getElementById('chart-bars').innerHTML=rhums.length===0?'<div class="empty" style="width:100%">Aucun rhum</div>':rhums.map(r=>{const q=qv(r.id);const p=Math.round((q/mx)*100);return`<div class="cb-col"><div class="cb-val">${q}</div><div class="cb-bar" style="height:${Math.max(p,4)}%"></div><div class="cb-lbl">${r.nom.split(' ')[0]}</div></div>`;}).join('');
  const fw=rhums.filter(r=>r.stock<=5);
  document.getElementById('stocks-faibles').innerHTML=fw.length===0?'<div class="empty" style="padding:.5rem 0">Tous les stocks sont bons ✓</div>':fw.map(r=>`<div class="stock-row"><span>${EM[r.type]||'🍹'} ${r.nom}</span><span class="badge-low">${r.stock} restantes</span></div>`).join('');
  const last=[...ventes].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);
  document.getElementById('last-ventes').innerHTML=last.length===0?'<div class="empty" style="padding:.5rem 0">Aucune vente</div>':last.map(v=>{const r=gr(v.rhumId);return`<div class="vente-card"><div class="vc-left"><div class="vc-name">${r?r.nom:'?'}</div><div class="vc-meta">${v.qte} btl · ${fdt(v.date)}${v.client?' · '+v.client:''}</div></div><div class="vc-right"><div class="vc-price">${eur(tv(v))}</div></div></div>`;}).join('');
}

function renderCat(){
  document.getElementById('cat-sub').textContent=`${rhums.length} référence${rhums.length>1?'s':''}`;
  document.getElementById('rhum-list').innerHTML=rhums.length===0?'<div class="empty">Aucun rhum — ajoutez votre première référence !</div>':rhums.map(r=>`
    <div class="rhum-card">
      <div class="rh-left"><div class="rh-emoji">${EM[r.type]||'🍹'}</div><span class="pill ${PL[r.type]||'p-gray'}">${r.type}</span></div>
      <div class="rh-right">
        <div class="rh-name">${r.nom}</div>
        <div class="rh-meta">${r.degre}° alc.${r.millesime?' · '+r.millesime:''}</div>
        <div class="rh-row"><div class="rh-price">${eur(r.prix)}</div><div class="rh-stock"><strong>${r.stock}</strong> btl</div></div>
        <div class="deg-bar"><div class="deg-fill" style="width:${Math.min(r.degre,90)/90*100}%"></div></div>
        <div class="rh-actions">
          <button class="btn-stk" onclick="addStock(${r.id})"><i class="ti ti-plus" style="font-size:12px"></i> Stock</button>
          <button class="btn-del" onclick="delRhum(${r.id})"><i class="ti ti-trash" style="font-size:18px"></i></button>
        </div>
      </div>
    </div>`).join('');
}

function toggleF(id){const f=document.getElementById(id);f.style.display=f.style.display==='block'?'none':'block';if(id==='f-dep')document.getElementById('nd-date').value=new Date().toISOString().slice(0,10);}
function addRhum(){const nom=document.getElementById('nr-nom').value.trim(),prix=parseFloat(document.getElementById('nr-prix').value),stock=parseInt(document.getElementById('nr-stock').value)||0;if(!nom||isNaN(prix)){alert('Nom et prix requis.');return;}rhums.push({id:nR++,nom,type:document.getElementById('nr-type').value,prix,stock,degre:parseFloat(document.getElementById('nr-degre').value)||40,millesime:document.getElementById('nr-millesime').value});toggleF('f-rhum');['nr-nom','nr-prix','nr-stock','nr-degre','nr-millesime'].forEach(id=>document.getElementById(id).value='');mark();renderCat();toast('Rhum ajouté — sauvegardez !');}
function delRhum(id){if(!confirm('Supprimer ce rhum ?'))return;rhums=rhums.filter(r=>r.id!==id);mark();renderCat();toast('Rhum supprimé');}
function addStock(id){const q=parseInt(prompt('Bouteilles à ajouter ?'));if(!q||q<=0)return;rhums=rhums.map(r=>r.id===id?{...r,stock:r.stock+q}:r);mark();renderCat();toast(`+${q} bouteilles — sauvegardez !`);}

function renderVentes(){
  document.getElementById('ventes-sub').textContent=`${ventes.length} vente${ventes.length>1?'s':''} · ${eur(ca())}`;
  document.getElementById('btn-clear-v').style.display=ventes.length>0?'flex':'none';
  const s=[...ventes].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('ventes-list').innerHTML=s.length===0?'<div class="empty">Aucune vente enregistrée</div>':s.map(v=>{const r=gr(v.rhumId);return`<div class="vente-card"><div class="vc-left"><div class="vc-name">${r?r.nom:'?'}</div><div class="vc-meta">${v.qte} btl · ${fdt(v.date)}${v.client?' · '+v.client:''}<br><span style="opacity:.7">${v.lieu}</span></div></div><div class="vc-right"><div class="vc-price">${eur(tv(v))}</div><button class="btn-del" onclick="delVente(${v.id})"><i class="ti ti-trash" style="font-size:18px"></i></button></div></div>`;}).join('');
}
function delVente(id){const v=ventes.find(x=>x.id===id);if(!v)return;const r=gr(v.rhumId);if(!confirm(`Supprimer cette vente ?`))return;ventes=ventes.filter(x=>x.id!==id);mark();renderVentes();toast('Vente supprimée');}
function clearVentes(){if(!confirm(`Effacer les ${ventes.length} ventes ?`))return;ventes=[];nV=1;mark();renderVentes();toast('Historique effacé');}

function addDep(){const desc=document.getElementById('nd-desc').value.trim(),montant=parseFloat(document.getElementById('nd-montant').value),date=document.getElementById('nd-date').value;if(!desc||isNaN(montant)||!date){alert('Tous les champs sont requis.');return;}depenses.push({id:nD++,desc,cat:document.getElementById('nd-cat').value,montant,date});toggleF('f-dep');['nd-desc','nd-montant'].forEach(id=>document.getElementById(id).value='');mark();renderDep();toast('Dépense ajoutée — sauvegardez !');}
function delDep(id){if(!confirm('Supprimer cette dépense ?'))return;depenses=depenses.filter(d=>d.id!==id);mark();renderDep();toast('Dépense supprimée');}
function renderDep(){
  document.getElementById('dep-sub').textContent=`${depenses.length} entrée${depenses.length>1?'s':''} · ${eur(tdep())}`;
  const s=[...depenses].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('dep-list').innerHTML=s.length===0?'<div class="empty">Aucune dépense enregistrée</div>':s.map(d=>`<div class="vente-card"><div class="vc-left"><div class="vc-name">${d.desc}</div><div class="vc-meta"><span class="pill ${CPL[d.cat]||'p-gray'}">${d.cat}</span> · ${fdt(d.date)}</div></div><div class="vc-right"><div class="vc-price" style="color:var(--danger)">−${eur(d.montant)}</div><button class="btn-del" onclick="delDep(${d.id})"><i class="ti ti-trash" style="font-size:18px"></i></button></div></div>`).join('');
}

function renderBilan(){
  const c=ca(),d=tdep(),b=ben(),pos=b>=0,m=c>0?Math.round((b/c)*100):0;
  const pc={};depenses.forEach(x=>{pc[x.cat]=(pc[x.cat]||0)+x.montant;});
  const pr=rhums.map(r=>{const rev=ventes.filter(v=>v.rhumId===r.id).reduce((s,v)=>s+tv(v),0);return{nom:r.nom,rev};}).filter(x=>x.rev>0).sort((a,z)=>z.rev-a.rev);
  document.getElementById('bilan').innerHTML=`
    <div class="kpi-grid" style="margin-bottom:12px">
      <div class="kpi green"><div class="kl">Ventes</div><div class="kv">${eur(c)}</div></div>
      <div class="kpi red"><div class="kl">Dépenses</div><div class="kv">${eur(d)}</div></div>
    </div>
    <div class="panel" style="margin-bottom:12px;text-align:center">
      <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Bénéfice net</div>
      <div class="benefice-big" style="color:${pos?'var(--success)':'var(--danger)'}">${pos?'+':''}${eur(b)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Marge : ${m}%</div>
      <div class="marge-bar" style="margin-top:10px"><div class="marge-fill" style="width:${Math.min(Math.max(m,0),100)}%;background:${pos?'var(--success)':'var(--danger)'}"></div></div>
    </div>
    <div class="panel" style="margin-bottom:12px">
      <div class="panel-title">Revenus par rhum</div>
      ${pr.length===0?'<div class="empty" style="padding:.5rem 0">Aucune vente</div>':pr.map(x=>`<div class="bilan-row"><span style="color:var(--muted)">${x.nom}</span><span style="color:var(--success);font-weight:500">+${eur(x.rev)}</span></div>`).join('')}
      <div class="bilan-total"><span>Total</span><span style="color:var(--success)">+${eur(c)}</span></div>
    </div>
    <div class="panel">
      <div class="panel-title">Dépenses par catégorie</div>
      ${Object.entries(pc).sort((a,b)=>b[1]-a[1]).map(([cat,m])=>`<div class="bilan-row"><span style="color:var(--muted);font-size:13px">${cat}</span><span style="color:var(--danger);font-weight:500">−${eur(m)}</span></div>`).join('')||'<div class="empty" style="padding:.5rem 0">Aucune dépense</div>'}
      <div class="bilan-total"><span>Total</span><span style="color:var(--danger)">−${eur(d)}</span></div>
    </div>`;
}

function initAV(){
  const s=document.getElementById('v-rhum');
  s.innerHTML=rhums.length===0?'<option>Aucun rhum dans le catalogue</option>':rhums.map(r=>`<option value="${r.id}">${r.nom} (${eur(r.prix)})</option>`).join('');
  document.getElementById('v-date').value=new Date().toISOString().slice(0,10);
  autoPrix();
}
function autoPrix(){const id=parseInt(document.getElementById('v-rhum').value);const r=gr(id);if(r)document.getElementById('v-prix').value=r.prix;calcTotal();}
function calcTotal(){const q=parseInt(document.getElementById('v-qte').value)||0,p=parseFloat(document.getElementById('v-prix').value)||0;document.getElementById('v-total').textContent=eur(q*p);}
function addVente(){
  if(rhums.length===0){alert('Ajoutez d\'abord un rhum.');return;}
  const rhumId=parseInt(document.getElementById('v-rhum').value),qte=parseInt(document.getElementById('v-qte').value),prix=parseFloat(document.getElementById('v-prix').value),date=document.getElementById('v-date').value;
  if(!rhumId||!qte||isNaN(prix)||!date){alert('Remplissez tous les champs.');return;}
  const r=gr(rhumId);
  if(r&&r.stock<qte){if(!confirm(`Stock insuffisant (${r.stock} btl). Continuer ?`))return;}
  ventes.push({id:nV++,rhumId,qte,prix,client:document.getElementById('v-client').value,date,lieu:document.getElementById('v-lieu').value});
  if(r)rhums=rhums.map(rh=>rh.id===rhumId?{...rh,stock:Math.max(0,rh.stock-qte)}:rh);
  document.getElementById('v-client').value='';
  mark();toast('Vente ajoutée — sauvegardez !');
  go('ventes',document.querySelectorAll('.nav-btn')[0]);
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{b.classList.remove('active');if(i===0)b.classList.add('active');});
  document.querySelectorAll('.nav-btn')[3].click();
}
function exportData(){const blob=new Blob([JSON.stringify({rhums,ventes,depenses,nR,nV,nD,exportDate:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`rhums-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('Export téléchargé ✓');}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(e)=>{try{const d=JSON.parse(e.target.result);if(!d.rhums||!d.ventes){alert('Fichier invalide.');return;}if(!confirm(`Importer ${d.rhums.length} rhums, ${d.ventes.length} ventes et ${(d.depenses||[]).length} dépenses ?`))return;rhums=d.rhums;ventes=d.ventes;depenses=d.depenses||[];nR=d.nR||Math.max(...rhums.map(r=>r.id),0)+1;nV=d.nV||Math.max(...ventes.map(v=>v.id),0)+1;nD=d.nD||Math.max(...(depenses.length?depenses.map(x=>x.id):[0]),0)+1;mark();renderDash();toast('Import réussi — sauvegardez !');}catch(err){alert('Fichier corrompu.');}};reader.readAsText(file);event.target.value='';}

loadData();
</script>
</body>
</html>
